name: tests

# Policy as code runs here too, but as part of the full suite: the theme's test
# kinds (unit, shell) plus the installer's mutation pass.
on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the policy check diffs against the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: All test kinds (policy, unit, shell, mutation)
        run: bash tools/run_tests.sh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
